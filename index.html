<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Cars</title>
</head>

<body>

    <!-- My Favorite Cars -->
    <h1>My Favorite Cars 🚗</h1>

    <h2>My Favorite Cars</h2>

    <ul>
        <li>BMW M4 G82</li>
        <li>BMW M3 G80</li>
        <li>BMW M5</li>
    </ul>


    <!-- My Learning Steps -->
    <h2>My Learning Steps 💻</h2>

    <ol>
        <li>Learn HTML</li>
        <li>Practice CSS</li>
        <li>Learn JavaScript</li>
    </ol>


    <!-- BMW M4 Image -->
    <h2>BMW M4 G82 🏎️</h2>

    <img
        src="https://commons.wikimedia.org/wiki/Special:FilePath/BMW%20M4%20G82.jpg"

    >


    <!-- Google Link -->
    <h2>Google 🔗</h2>

    <p>Click the link below:</p>

    <a href="https://www.google.com" target="_blank">
        Visit Google
    </a>


    <!-- HTML Form -->
    <h2>Contact Me 📩</h2>

    <form>

        <label for="name">Name:</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your name"
        >

        <br><br>

        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
        >

        <br><br>

        <label for="message">Message:</label>
        <br>

        <textarea
            id="message"
            placeholder="Write your message"
        ></textarea>

        <br><br>

        <button type="submit">
            Send Message
        </button>

    </form>

</body>

</html>
